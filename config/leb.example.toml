[brain]
auto_learn = false
conservative_promotion = true
raw_transcript_retention_days = 0

[cache]
# Reserved until derived-cache invalidation is connected to storage generations.
enabled = false

[context]
max_injected_tokens = 6000
stable_prefix_tokens = 1800
# Deterministic local semantic retrieval (hashed n-gram embeddings over the
# SQLite vector sidecar). Off by default: enable only after a measured paired
# benchmark win (spec Appendix E/G); disabled keeps the ablation control exact.
semantic_retrieval = false

[daemon]
socket_path = "~/.leb/lebd.sock"
max_connections = 128
max_request_bytes = 1048576
request_timeout_ms = 30000
read_connections = 4
read_wait_timeout_ms = 5000
writer_queue_capacity = 4096
background_concurrency = 2
rss_soft_limit_mb = 600
rss_hard_limit_mb = 900

[jobs]
# Durable daemon-owned background jobs over the canonical `jobs` table.
# The daemon is the only executor: a single loop polls on a fixed interval,
# runs at most `daemon.background_concurrency` jobs at once, and starts no new
# job under hard RSS pressure. `consolidation_gc` and `fts_integrity`
# self-enqueue daily (dedupe-keyed by day); `semantic_rebuild` and
# `evidence_reverify` are enqueued on demand (`leb jobs enqueue ...`).
# Note: `evidence_reverify` never re-executes stored commands - repository-
# supplied commands are untrusted (spec 26.4); it only marks stale evidence.
enabled = true
poll_interval_ms = 5000
# Failing jobs retry with exponential backoff recorded in the row, then die.
# Allowed range: 1..=20.
max_attempts = 5
# context_runs/context_items older than this are deleted by the daily
# consolidation_gc job in bounded batches. Allowed range: 1..=3650 days.
context_run_retention_days = 90

[semantic]
# Bounds for the derived vector sidecar; the embedding dimension is a
# compile-time constant. The sidecar is rebuildable: `leb semantic rebuild .`
max_candidates = 50
max_scanned = 50000

[storage]
db_path = "~/.leb/brain.sqlite"
blob_budget_gb = 0
# Redacted evidence artifacts larger than this move out of the canonical row
# into `blobs/` beside the database; the row keeps a digest and a head excerpt.
# Allowed range: 1024..=1048576 bytes.
blob_threshold_bytes = 16384
vector_backend = "disabled"

[structural]
provider = "tree_sitter"
max_files = 100000
max_file_bytes = 2097152
git_history_commits = 50000
# Required only when provider = "graphify"; CLI --graphify overrides it.
# graphify_export = "/absolute/path/to/graphify-export.json"
max_graph_nodes = 2000000
max_graph_edges = 8000000
max_prepared_bytes = 268435456
max_graphify_export_bytes = 134217728

[embeddings]
provider = "disabled"
model = ""
allow_remote = false

[policy]
default_enforcement = "warn"

[network]
local_only = true

[proxy]
bind = "127.0.0.1:11435"
runtime_url = "http://127.0.0.1:8000"
failure_mode = "fail_open"

[security]
# Complete matches are replaced before durable persistence. Rust regex syntax;
# at most 32 patterns, each at most 1024 bytes.
custom_redaction_patterns = []

[evaluation]
record_trajectory_metrics = false

[synthesis]
# Episode-to-procedure synthesis (spec 16.3-16.5). A procedure draft (typed
# memory, kind "procedure") is created only when this many distinct successful
# episodes share one normalized strategy signature, each backed by verified
# deterministic/observational evidence, with overlapping touched files.
# Allowed range: 2..=64.
min_supporting_episodes = 3
# Distinct successfully-served tasks a validated procedure must have been
# injected for (via an explicitly declared context task_id) before it can be
# promoted to the "skill" kind. Allowed range: 1..=10000.
min_distinct_uses = 3
# Run a bounded synthesis pass automatically after each successful task
# finish. Off by default: V1 keeps learning explicit (spec P9).
auto = false
# Allow procedures validated in OTHER projects to enter this project as
# explicitly marked hypothesis memories (tags: hypothesis, cross_project)
# when local evidence exists but is below the threshold. Off by default.
cross_project_hypotheses = false
