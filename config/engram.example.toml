# One shared knowledge workspace by default, preserving existing state.
# Select another with --workspace NAME, ENGRAM_WORKSPACE=NAME, or this field
# in a repository's .engram/config.toml (CLI > environment > project > user).
# Names: 1-32 lowercase letters, digits, hyphens or underscores; start with a
# letter or digit. Named state lives in ~/.engram/workspaces/NAME/.
# Optional per-workspace tuning: ~/.engram/workspaces/NAME/config.toml, loaded
# after global config and before project config. Omit this selector there.
# Named profiles reset inherited DB/socket/vault paths and sync destinations;
# explicit state paths must stay inside that workspace. Blob, semantic, and
# hook state live beside the selected database. No repos are copied or indexed
# merely by selecting a workspace.
workspace = "default"

[brain]
auto_learn = false
conservative_promotion = true
raw_transcript_retention_days = 0

[cache]
# Reserved until derived-cache invalidation is connected to storage generations.
enabled = false

[context]
max_injected_tokens = 6000
stable_prefix_tokens = 1800
# Deterministic local semantic retrieval (hashed n-gram embeddings over the
# SQLite vector sidecar). Off by default: enable only after a measured paired
# benchmark win (spec Appendix E/G); disabled keeps the ablation control exact.
semantic_retrieval = false
# 0 = budget-limited only; N caps injected memories per compile.
max_injected_memories = 0
# Preference memories render as an imperative review-standards section
# (best measured composition; perf-evidence 2026-08-31). Set false to ablate.
review_standards_section = true
# Deterministic compact memory blocks omit full IDs and rationale boilerplate.
# Canonical memory text and context provenance are unchanged. Off by default so
# verbose-vs-compact benchmarks differ by exactly this flag.
compact_injection = false
# Task source pointers name `path:start-end` (1-based, inclusive) when the
# request's checkout file still has the indexed digest; a changed or unreadable
# file keeps a file-level pointer. Ranges never change which sources are chosen.
source_line_ranges = true
# After all direct source pointers, list up to six resolved callers and
# same-file shared-call users of definitions the task names, within the
# remaining source budget. Retrieval-level diagnostics only; set false to ablate.
related_use_cues = true

[daemon]
socket_path = "~/.engram/engramd.sock"
max_connections = 128
max_request_bytes = 1048576
request_timeout_ms = 30000
read_connections = 4
read_wait_timeout_ms = 5000
writer_queue_capacity = 4096
background_concurrency = 2
rss_soft_limit_mb = 600
rss_hard_limit_mb = 900

[jobs]
# Durable daemon-owned background jobs over the canonical `jobs` table.
# The daemon is the only executor: a single loop polls on a fixed interval,
# runs at most `daemon.background_concurrency` jobs at once, and starts no new
# job under hard RSS pressure. `consolidation_gc` and `fts_integrity`
# self-enqueue daily (dedupe-keyed by day); `semantic_rebuild` and
# `evidence_reverify` are enqueued on demand (`engram jobs enqueue ...`).
# Note: `evidence_reverify` never re-executes stored commands - repository-
# supplied commands are untrusted (spec 26.4); it only marks stale evidence.
enabled = true
poll_interval_ms = 5000
# Failing jobs retry with exponential backoff recorded in the row, then die.
# Allowed range: 1..=20.
max_attempts = 5
# context_runs/context_items older than this are deleted by the daily
# consolidation_gc job in bounded batches. Allowed range: 1..=3650 days.
context_run_retention_days = 90

[semantic]
# Bounds for the derived vector sidecar; the embedding dimension is a
# compile-time constant. The sidecar is rebuildable: `engram semantic rebuild .`
max_candidates = 50
max_scanned = 50000

[storage]
db_path = "~/.engram/brain.sqlite"
blob_budget_gb = 0
# Redacted evidence artifacts larger than this move out of the canonical row
# into `blobs/` beside the database; the row keeps a digest and a head excerpt.
# Allowed range: 1024..=1048576 bytes.
blob_threshold_bytes = 16384
vector_backend = "disabled"

[structural]
provider = "tree_sitter"
max_files = 100000
max_file_bytes = 2097152
git_history_commits = 50000
# Required only when provider = "graphify"; CLI --graphify overrides it.
# graphify_export = "/absolute/path/to/graphify-export.json"
max_graph_nodes = 2000000
max_graph_edges = 8000000
max_prepared_bytes = 268435456
max_graphify_export_bytes = 134217728

[embeddings]
provider = "disabled"
model = ""
allow_remote = false

[policy]
default_enforcement = "warn"

[network]
# Keep all configured providers on this machine. A remote proxy runtime needs
# this set to false AND proxy.allow_remote_runtime set to true.
local_only = true

[proxy]
# The proxy listener itself always remains loopback-only.
bind = "127.0.0.1:11435"
runtime_url = "http://127.0.0.1:8000"
# Second, proxy-specific opt-in for sending model requests off-machine. Remote
# URLs must use HTTPS and must not contain credentials, a query, or a fragment.
# Authentication belongs in client request headers, which the proxy forwards.
allow_remote_runtime = false
failure_mode = "fail_open"

[security]
# Complete matches are replaced before durable persistence. Rust regex syntax;
# at most 32 patterns, each at most 1024 bytes.
custom_redaction_patterns = []

[evaluation]
record_trajectory_metrics = false

[synthesis]
# Episode-to-procedure synthesis (spec 16.3-16.5). A procedure draft (typed
# memory, kind "procedure") is created only when this many distinct successful
# episodes share one normalized strategy signature, each backed by verified
# deterministic/observational evidence, with overlapping touched files.
# Allowed range: 2..=64.
min_supporting_episodes = 3
# Distinct successfully-served tasks a validated procedure must have been
# injected for (via an explicitly declared context task_id) before it can be
# promoted to the "skill" kind. Allowed range: 1..=10000.
min_distinct_uses = 3
# Run a bounded synthesis pass automatically after each successful task
# finish. Off by default: V1 keeps learning explicit (spec P9).
auto = false
# Allow procedures validated in OTHER projects to enter this project as
# explicitly marked hypothesis memories (tags: hypothesis, cross_project)
# when local evidence exists but is below the threshold. Off by default.
cross_project_hypotheses = false

[judge]
# Optional evidence judge. Local uses an OpenAI-compatible endpoint.
# Existing deterministic evidence checks still gate every promotion.
enabled = false
provider = "local"
allow_remote = false
# TypeSafe alternative: provider="typesafe", allow_remote=true,
# endpoint="https://api.typesafe.ai/v1/systemone", model="jev-1.13.0".
# Requires network.local_only=false and TYPESAFE_API_KEY in the daemon environment.
# Only redacted review packets are sent, but these can contain proprietary data.
# This threshold is a decision policy, not an empirically calibrated accuracy.
acceptance_threshold = 0.98
endpoint = "http://127.0.0.1:11434/v1/chat/completions"
model = ""
interval_seconds = 300
timeout_seconds = 90
batch_size = 2
max_input_bytes = 49152
max_output_tokens = 1200
max_retries = 3
retry_seconds = 1800

[vault]
# Derived Obsidian vault: per-repo notes, mermaid module maps, memory notes,
# and the workspace overview. Point Obsidian at `root`.
enabled = false
root = "~/.engram/vault"
# Re-export automatically (durable background job) after every structural
# scan, so notes and diagrams track the code.
auto_refresh = true

[links]
# After each index, scan the repo's own manifests (Cargo path deps, npm
# file: deps, pip editable installs, git submodules) and auto-link
# DEFINITIVE matches. Name-only and route-overlap matches stay proposals
# surfaced by `engram link scan`.
auto_scan = true

[architect]
# `engram architect` synthesizes the workspace architecture guide.
# runtime_url is an OpenAI-compatible endpoint (loopback unless
# network.local_only = false); `engram architect --claude` uses the claude CLI.
runtime_url = "http://127.0.0.1:8010/v1/chat/completions"
model = ""
# Automatic regeneration when the guide's STABLE projection drifts
# (services, facts, tech, links, module names, routes - not per-commit
# noise): "off" | "local" | "claude".
auto = "off"
auto_min_secs = 3600

[web]
# The workspace browser, served by the daemon. Loopback by default; binding
# beyond loopback (a central team server) REQUIRES `token`, which then gates
# every /api and /webhook request.
# Named workspaces disable this listener unless their own profile/project
# explicitly enables it on a different port, e.g. 12436. Give each running
# named workspace a unique port; 11436 is reserved for the default workspace.
enabled = true
port = 11436
bind = "127.0.0.1"
# token = "<long-random-token>"

[watch]
# Commit-driven freshness: compares committed HEADs only (dirty edits never
# trigger). Local poll re-indexes on commits/branch switches; origin poll
# fetches and refreshes shared-truth views (0 disables).
enabled = true
local_poll_secs = 30
origin_poll_secs = 900

[sync]
# Cross-instance knowledge sync. Down: the central instance's VALIDATED
# memories, facts, and links replicate here and inject. Up: local validated
# memories are offered to central as candidates for curation.
central_url = ""
# token = "<the central token>"
every_secs = 900
push = true
