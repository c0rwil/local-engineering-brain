[package]
name = "local-engineering-brain"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A local-first engineering world model and durable memory"
license = "MIT OR Apache-2.0"

[lib]
name = "leb"
path = "src/lib.rs"

[[bin]]
name = "leb"
path = "src/main.rs"

[[bin]]
name = "lebd"
path = "src/bin/lebd.rs"

[[bin]]
name = "leb-proxy"
path = "src/bin/leb-proxy.rs"

[[bin]]
name = "leb-mcp"
path = "src/bin/leb-mcp.rs"

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
bytes = "1.12.1"
clap = { version = "4.6.6", features = ["derive"] }
http-body-util = "0.1.5"
hyper = { version = "1.11.1", features = ["client", "http1"] }
hyper-util = { version = "0.1.20", features = ["tokio"] }
ignore = "0.4.25"
moka = { version = "0.12.16", features = ["sync"] }
reqwest = { version = "0.13.4", default-features = false, features = ["json", "stream"] }
regex = "1.12.3"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11.0"
thiserror = "2.0.20"
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["io-std", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
toml = "1.1.4"
tree-sitter = "0.26.13"
tree-sitter-python = "0.25.0"
tree-sitter-rust = "0.24.2"
tree-sitter-typescript = "0.23.2"
url = "2.5.8"
uuid = { version = "1.26.0", features = ["v4", "serde"] }
yaml_serde = "0.10.7"

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"

[profile.release]
lto = "thin"
strip = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
