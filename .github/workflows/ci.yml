name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# One in-flight run per ref. Pushing again to a branch or PR cancels the
# superseded run instead of queueing behind it.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Keep this in lockstep with rust-toolchain.toml and CONTRIBUTING.md.
  RUST_VERSION: "1.96.0"
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: lint
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: cargo fmt --check
        run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: clippy
      # Warnings are hard errors. Cargo.toml already sets clippy::all and
      # clippy::pedantic to warn; -D warnings is what turns them into a gate.
      - name: cargo clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        # macOS bills at 10x on private repos and the dev machine already
        # runs the full gate suite on macOS before every push; per-push CI
        # covers Linux, and `workflow_dispatch` runs the macOS legs on demand.
        os: ${{ github.event_name == 'workflow_dispatch' && fromJSON('["ubuntu-latest", "macos-latest"]') || fromJSON('["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}
      # Hermetic retrieval regression gate: an isolated engramd indexes the
      # synthetic repository in tests/fixtures/retrieval_repo and checks ranking,
      # definition hits, no filler, budgets and zero off-mode injection. The full
      # run below includes it too; this step fails fast and prints the report.
      - name: retrieval regression gate
        run: cargo test --locked --test retrieval_regression -- --nocapture
      # This is the release gate from README.md verbatim, except that the two
      # latency/RSS assertions in tests/performance.rs are filtered out at the
      # libtest level. They still compile here (so a broken perf test is
      # caught), but they are measured for real by the `perf` job below on a
      # dedicated runner, because wall-clock and RSS bounds are not meaningful
      # on a noisy shared runner.
      - name: cargo test
        run: |
          cargo test --locked --all-targets --all-features -- \
            --skip warmed_context_compile_stays_under_hard_v1_ceiling \
            --skip medium_daemon_concurrency_stays_within_latency_rss_and_token_bounds
      # The real-repository harness scripts are macOS-only (APFS clones and
      # /private/tmp sandbox roots), so their hermetic Python tests run on the
      # macOS leg. They use fake agent CLIs; no model or network is involved.
      - name: python harness tests (macOS)
        if: runner.os == 'macOS'
        run: python3 -B -m unittest discover -s tests -p 'test_*.py'

  release-build:
    name: release build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        # macOS bills at 10x on private repos and the dev machine already
        # runs the full gate suite on macOS before every push; per-push CI
        # covers Linux, and `workflow_dispatch` runs the macOS legs on demand.
        os: ${{ github.event_name == 'workflow_dispatch' && fromJSON('["ubuntu-latest", "macos-latest"]') || fromJSON('["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.os }}
      # --locked proves Cargo.lock is complete and up to date: the build fails
      # rather than silently resolving a different dependency set.
      - name: cargo build --release
        run: cargo build --release --locked

  perf:
    name: performance gates (informational)
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    timeout-minutes: 30
    # Not a required check. These tests assert latency and RSS ceilings that
    # hold on the Apple Silicon target but are inherently noisy on hosted
    # runners; a red mark here is a signal to investigate, not a merge block.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: perf-macos-latest
      - name: cargo test --test performance --release
        run: cargo test --locked --test performance --release -- --nocapture
